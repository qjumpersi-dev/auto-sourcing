version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: src/AutoSourcing.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - autosourcing-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - autosourcing-network

networks:
  autosourcing-network:
    driver: bridge
