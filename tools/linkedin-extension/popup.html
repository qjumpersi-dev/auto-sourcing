<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AITS LinkedIn Sender</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        font-size: 13px;
        color: #111827;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 4px;
      }
      p.sub {
        margin: 0 0 12px;
        color: #6b7280;
        font-size: 12px;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        font-weight: 600;
      }
      input[type='text'],
      input[type='password'] {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 9px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 13px;
      }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 8px 10px;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #e5e7eb;
        color: #111827;
      }
      .status {
        margin-top: 12px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #f3f4f6;
        font-size: 12px;
      }
      .ok {
        background: #dcfce7;
        color: #166534;
      }
      .err {
        background: #fee2e2;
        color: #991b1b;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }
      .hint {
        margin-top: 8px;
        color: #6b7280;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>AITS LinkedIn Sender</h1>
    <p class="sub">Sends your queued InMails from this browser's LinkedIn session.</p>

    <label for="apiUrl">App address</label>
    <input id="apiUrl" type="text" placeholder="https://www.quickmatchai.com" />

    <label for="code">Connect code</label>
    <input id="code" type="text" placeholder="e.g. K7QP2M9X" />

    <button id="connect">Connect</button>

    <div class="row">
      <input id="enabled" type="checkbox" style="width: auto" />
      <label for="enabled" style="margin: 0">Send InMails automatically</label>
    </div>

    <div id="status" class="status">Not connected.</div>
    <div class="hint">
      Get a code from the app: Account settings &rarr; Connect LinkedIn extension.
    </div>

    <button id="disconnect" class="secondary">Disconnect</button>

    <script src="popup.js"></script>
  </body>
</html>
